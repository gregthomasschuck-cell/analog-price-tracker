name: Price pull

# Runs every day. Each run only fetches parts not yet captured for the current
# week, so on most days it finishes in seconds. Daily runs let a basket larger
# than one day's API quota complete over several days.
on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC daily (7:17 am New York in summer)
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: price-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull prices from DigiKey and Mouser
        env:
          DIGIKEY_CLIENT_ID: ${{ secrets.DIGIKEY_CLIENT_ID }}
          DIGIKEY_CLIENT_SECRET: ${{ secrets.DIGIKEY_CLIENT_SECRET }}
          MOUSER_API_KEY: ${{ secrets.MOUSER_API_KEY }}
        run: python tracker.py pull

      - name: Rebuild the website
        run: |
          if [ -s data/observations.csv ]; then
            python tracker.py build --out docs
          else
            echo "No prices yet (check the API secrets); leaving the sample site in place."
          fi

      - name: Save new prices and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet -- data; then
            echo "No new prices since the last run; nothing to commit."
            exit 0
          fi
          git commit -m "Prices: $(date -u +%Y-%m-%d)"
          git push
